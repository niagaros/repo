# Security headers for every Niagaros web domain served by Amplify (#272): app.niagaros.com, trust.niagaros.com,
# customers' Trust Center domains and the *.amplifyapp.com branch URLs. Amplify reads this file at build time.
# The CSP blocks framing, plugins and <base> hijacking; script sources are not restricted yet because the
# standalone pages still use inline scripts and CDN libraries.
applications:
  - appRoot: frontend
    customHeaders:
      - pattern: '**'
        headers:
          - key: Strict-Transport-Security
            value: max-age=31536000; includeSubDomains
          - key: Content-Security-Policy
            value: "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; upgrade-insecure-requests"
          - key: X-Frame-Options
            value: DENY
          - key: X-Content-Type-Options
            value: nosniff
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
          - key: Permissions-Policy
            value: camera=(), microphone=(), geolocation=(), payment=()
