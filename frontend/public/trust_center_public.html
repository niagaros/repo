<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trust Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e4e7ec;--line-soft:#eff1f4;--ink:#0b1220;--ink-2:#344054;--muted:#667085;--faint:#98a2b3;
  --accent:#2563eb;--accent-soft:#eff4ff;--ok:#16a34a;--ok-soft:#ecfdf3;--warn:#d97706;--bad:#dc2626;--nav-h:64px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 16px)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;min-height:100vh;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input{font-family:inherit}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* navigation */
.top{position:sticky;top:0;z-index:50;height:var(--nav-h);background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{height:100%;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none}
.logo{width:34px;height:34px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.brand-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-tc{font-size:13px;color:var(--muted);font-weight:500;padding-left:10px;border-left:1px solid var(--line);white-space:nowrap}
.links{display:flex;gap:2px;margin:0 auto}
.links a{text-decoration:none;font-size:13px;font-weight:500;color:var(--muted);padding:7px 11px;border-radius:7px}
.links a:hover{color:var(--ink);background:var(--bg)}
.links a.on{color:var(--ink);background:var(--bg)}
.top-actions{display:flex;gap:8px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--ink);color:#fff;border:1px solid var(--ink);padding:9px 15px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:#1d2939}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{background:var(--bg)}
.btn-light{background:#fff;color:var(--ink);border-color:#fff}
.btn-light:hover{background:#f2f4f7}
.btn-outline-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}
.btn-outline-light:hover{background:rgba(255,255,255,.08)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}

/* hero */
.hero{position:relative;overflow:hidden;background:#0b1220;color:#fff}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(900px 420px at 85% -10%,rgba(37,99,235,.45),transparent 60%),radial-gradient(700px 380px at -10% 120%,rgba(22,163,74,.22),transparent 60%)}
.hero::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(180deg,#000,transparent 85%)}
.hero .wrap{position:relative;z-index:1;padding-top:56px;padding-bottom:40px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:48px;align-items:center}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#bbf7d0;background:rgba(22,163,74,.14);border:1px solid rgba(74,222,128,.3);padding:5px 11px;border-radius:999px}
.live-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.hero-logo{width:56px;height:56px;border-radius:14px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;margin:20px 0 18px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.hero h1{font-size:40px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.hero p{font-size:15.5px;color:#cbd5e1;max-width:60ch;margin-top:14px;white-space:pre-wrap}
.hero-cta{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.summary{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:8px;backdrop-filter:blur(6px)}
.sum-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:11px}
.sum-row+.sum-row{border-top:1px solid rgba(255,255,255,.08)}
.sum-ic{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#93c5fd;flex-shrink:0}
.sum-v{font-size:20px;font-weight:800;line-height:1.2}
.sum-l{font-size:12px;color:#94a3b8}
.search{display:block;position:relative;margin-top:8px;grid-column:1/-1}
.search input{width:100%;height:50px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;font-size:14px;padding:0 16px 0 46px;outline:none;transition:border-color .15s,background .15s}
.search input::placeholder{color:#94a3b8}
.search input:focus{border-color:rgba(147,197,253,.7);background:rgba(255,255,255,.1)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#94a3b8}

/* sections */
main{padding:44px 0 72px}
.sec{margin-bottom:52px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.sec h2{font-size:22px;font-weight:800;letter-spacing:-.015em}
.sec-sub{font-size:13.5px;color:var(--muted);margin-top:4px;max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:#cbd5e1}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{opacity:.6;font-weight:500;margin-left:3px}

/* compliance */
.fw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fw{padding:16px;display:flex;gap:14px;align-items:flex-start;transition:border-color .15s,box-shadow .15s}
.fw:hover{border-color:#cbd5e1;box-shadow:0 6px 20px rgba(16,24,40,.06)}
.badge{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-weight:800;border:1px solid}
.badge b{font-size:11px;letter-spacing:.02em;overflow-wrap:normal;white-space:nowrap}
.badge b.sm{font-size:8.5px;letter-spacing:0}
.badge i{font-style:normal;font-size:10px;font-weight:700;opacity:.8;margin-top:2px}
.fw-body{flex:1;min-width:0}
.fw-name{font-size:13.5px;font-weight:700;line-height:1.3}
.fw-cat{font-size:11.5px;color:var(--faint);margin-top:2px}
.bar{height:6px;background:var(--line-soft);border-radius:99px;margin-top:10px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px}
.fw-foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:11.5px;color:var(--faint)}
.fw-score{font-weight:800;font-size:13px}
.more{margin-top:16px;text-align:center}

/* documents */
.doc-list{overflow:hidden}
.doc{display:flex;align-items:center;gap:14px;padding:14px 18px}
.doc+.doc{border-top:1px solid var(--line-soft)}
.doc-ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.doc-b{flex:1;min-width:0}
.tag{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.doc-t{font-size:14px;font-weight:600;margin-top:1px}
.vis{font-size:12px;color:var(--faint);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}

/* security */
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sp{padding:20px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,box-shadow .15s,transform .15s}
.sp:hover{border-color:#bfd2fe;box-shadow:0 8px 24px rgba(16,24,40,.07);transform:translateY(-1px)}
.sp-top{display:flex;align-items:center;gap:12px}
.sp-ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sp-t{font-size:15px;font-weight:700}
.sp-x{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sp-x.empty{color:var(--faint);font-style:italic}
.sp-m{font-size:12.5px;font-weight:600;color:var(--accent);margin-top:auto;display:inline-flex;align-items:center;gap:4px}
.sp[disabled]{cursor:default}
.sp[disabled]:hover{border-color:var(--line);box-shadow:none;transform:none}

/* faq */
.faq{overflow:hidden}
.faq details+details{border-top:1px solid var(--line-soft)}
.faq summary{list-style:none;cursor:pointer;padding:16px 20px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'';width:9px;height:9px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);transition:transform .2s;flex-shrink:0;margin-top:-4px}
.faq details[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.faq .a{padding:0 20px 18px;font-size:13.5px;color:var(--ink-2);white-space:pre-wrap}

.empty-note{padding:22px;font-size:13px;color:var(--faint);text-align:center}
.no-results{padding:28px;text-align:center;color:var(--muted)}
.cta{background:#0b1220;color:#fff;border-radius:18px;padding:30px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden}
.cta::before{content:'';position:absolute;inset:0;background:radial-gradient(500px 220px at 100% 0,rgba(37,99,235,.4),transparent 60%)}
.cta>*{position:relative}
.cta h2{font-size:20px;font-weight:800}
.cta p{color:#cbd5e1;font-size:13.5px;margin-top:4px}
.foot{border-top:1px solid var(--line);background:#fff}
.foot .wrap{padding-top:22px;padding-bottom:22px;font-size:12.5px;color:var(--faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot b{color:var(--ink-2)}

/* states */
.spin-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;gap:12px;color:var(--faint)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{max-width:520px;margin:15vh auto 0;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:24px;text-align:center;color:#991b1b}

/* modals */
.overlay{position:fixed;inset:0;background:rgba(11,18,32,.5);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;padding:16px}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:16px;width:460px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.25)}
.modal.wide{width:700px}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line-soft)}
.modal-title{font-size:16px;font-weight:700}
.modal-close{width:30px;height:30px;border:none;background:var(--line-soft);border-radius:8px;cursor:pointer;flex-shrink:0}
.modal-body{padding:18px 20px;overflow:auto}
.modal-text{font-size:13.5px;color:var(--ink-2);white-space:pre-wrap;line-height:1.7}
.f-lbl{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px;display:block}
.f-in,.f-ta{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:12px;outline:none}
.f-in:focus,.f-ta:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.f-ta{resize:vertical;min-height:64px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line-soft);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:200;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;max-width:calc(100vw - 44px)}
.toast.show{opacity:1;transform:translateY(0)}

@media (max-width:900px){
  .links{display:none}
  .top-actions{margin-left:auto}
  .hero .wrap{grid-template-columns:1fr;gap:28px;padding-top:36px}
}
@media (max-width:600px){
  .wrap{padding:0 16px}
  .brand-tc,.top-actions .btn-ghost{display:none}
  .hero h1{font-size:28px}
  .hero p{font-size:14.5px}
  .search{margin-top:8px}
  .sp-grid,.fw-grid{grid-template-columns:1fr}
  .doc{flex-wrap:wrap}
  .doc .doc-act{width:100%;justify-content:space-between;flex-wrap:wrap;gap:8px!important}
  .cta{padding:24px}
}
</style>
</head>
<body>

<div id="v-load" class="spin-wrap"><div class="spinner"></div><span>Loading…</span></div>
<div id="v-error" hidden class="error-box"></div>
<div id="v-content" hidden></div>

<div class="overlay" id="ov-request">
  <div class="modal">
    <div class="modal-hdr"><div class="modal-title">Request access</div><button class="modal-close" data-close aria-label="Close">✕</button></div>
    <div class="modal-body">
      <div id="req-doc" style="font-size:13px;color:var(--muted);margin-bottom:14px"></div>
      <label class="f-lbl" for="req-name">Name</label>
      <input class="f-in" id="req-name" autocomplete="name">
      <label class="f-lbl" for="req-email">Work email</label>
      <input class="f-in" id="req-email" type="email" autocomplete="email">
      <label class="f-lbl" for="req-reason">Reason (optional)</label>
      <textarea class="f-ta" id="req-reason" placeholder="e.g. part of a vendor assessment"></textarea>
      <div style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px">
        <label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--ink-2);line-height:1.5;cursor:pointer">
          <input type="checkbox" id="req-nda" style="margin-top:2px">
          <span>I agree to keep the contents of this document confidential and not share it with third parties without permission.</span>
        </label>
        <label class="f-lbl" for="req-nda-name" style="margin-top:10px">Full name to confirm</label>
        <input class="f-in" id="req-nda-name" placeholder="Type your full name" style="margin-bottom:0">
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn" id="req-send">Send request</button></div>
  </div>
</div>

<div class="overlay" id="ov-topic">
  <div class="modal wide">
    <div class="modal-hdr"><div class="modal-title" id="topic-title"></div><button class="modal-close" data-close aria-label="Close">✕</button></div>
    <div class="modal-body"><div class="modal-text" id="topic-text"></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TC_API = 'https://hzf92ft6j7.execute-api.eu-west-1.amazonaws.com/default/trust-center';
let data=null, requestingDocId=null, docFilter='all', fwCat='All', showAllFw=false, query='';
const FW_PREVIEW=8;
const APP_HOST_RE=/(^|\.)d3joqokkaynfaq\.amplifyapp\.com$|^app\.niagaros\.com$|^localhost$|^127\.0\.0\.1$/;

const svg=(d,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I={
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  check:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M16 7l3 3M18 5l2 2"/>',
  server:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  bug:'<path d="M8 2l1.9 1.9M16 2l-1.9 1.9M9 7.1V6a3 3 0 0 1 6 0v1.1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6zM12 20v-9M6.5 13H3M21 13h-3.5M6 9 3.5 7.5M18 9l2.5-1.5M6 17l-2.5 1.5M18 17l2.5 1.5"/>',
  alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/>',
  db:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
};
// Framework family, only to group and colour the badges; the scores themselves come from the API unchanged
const CATS=[
  ['AI governance',/\bAI\b|42001/i,'#7c3aed','#f5f3ff','#ddd6fe'],
  ['Privacy',/GDPR|27701|27018|privacy|CCPA|SSPA|HIPAA/i,'#0891b2','#ecfeff','#a5f3fc'],
  ['Regulation',/DORA|NIS ?2|NYDFS|PCI|FedRAMP|TISAX|CRI|Cyber Resilience/i,'#c2410c','#fff7ed','#fed7aa'],
  ['Security',/./,'#2563eb','#eff6ff','#bfdbfe'],
];
function fwCatOf(name){return CATS.find(c=>c[1].test(name||''));}
function badgeParts(name){
  const words=String(name||'').replace(/[():]/g,' ').split(/[\s/]+/).filter(Boolean);
  const top=(words[0]||'?').slice(0,7).toUpperCase();
  const num=words.slice(1).find(w=>/\d/.test(w));
  return [top, num?num.replace(/^v/i,'').split(':')[0].slice(0,6):''];
}
function topicIcon(t){
  t=String(t||'').toLowerCase();
  if(/encrypt|crypto/.test(t)) return I.lock;
  if(/identity|access|iam|auth/.test(t)) return I.key;
  if(/vulnerab|pen ?test|patch/.test(t)) return I.bug;
  if(/incident|monitor|detect|logging/.test(t)) return I.alert;
  if(/backup|recover|continuity|resilien/.test(t)) return I.refresh;
  if(/privacy|data/.test(t)) return I.db;
  if(/infra|network|cloud|server/.test(t)) return I.server;
  return I.shield;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(u){try{const x=new URL(u);return x.protocol==='https:'?x.href:null;}catch(e){return null;}}
function fmtDate(d){const x=d?new Date(d):null;return x&&!isNaN(x)?x.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'unknown';}
function scoreColor(s){return s>=75?'var(--ok)':s>=50?'var(--warn)':'var(--bad)';}
function matches(...parts){return !query||parts.join(' ').toLowerCase().includes(query);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
function closeOv(){document.querySelectorAll('.overlay.open').forEach(o=>o.classList.remove('open'));}

async function load(){
  // On a company's own Trust Center domain the hostname alone picks the Trust Center: a ?slug= there could show
  // another company's page under that company's address
  const customHost=!APP_HOST_RE.test(location.hostname);
  const slug=customHost ? null : new URLSearchParams(location.search).get('slug');
  const downloadDoc=new URLSearchParams(location.search).get('download');
  const token=new URLSearchParams(location.search).get('token');
  if(downloadDoc && token){
    const r=await fetch(TC_API+'?download_document='+encodeURIComponent(downloadDoc)+'&access_token='+encodeURIComponent(token));
    const d=await r.json();
    const url=r.ok && safeUrl(d.download_url);
    if(url){ location.href=url; return; }
    showError(d.error||'This link no longer works.');
    return;
  }
  const domain=customHost ? location.hostname : null;
  if(!slug && !domain){ showError('No Trust Center specified.'); return; }
  try{
    const r=await fetch(TC_API+(slug?'?slug='+encodeURIComponent(slug):'?domain='+encodeURIComponent(domain)));
    const d=await r.json();
    if(!r.ok){ showError(d.error||'This page does not exist.'); return; }
    data=d;
    ['compliance','documents','security_posture','qa_highlights'].forEach(k=>{ if(!Array.isArray(data[k])) data[k]=[]; });
    render();
  }catch(e){
    showError('Could not load this page.');
  }
}
function showError(msg){
  document.getElementById('v-load').hidden=true;
  document.getElementById('v-error').hidden=false;
  document.getElementById('v-error').textContent=msg;
}

function fwList(){return data.compliance.filter(c=>(fwCat==='All'||fwCatOf(c.framework)[0]===fwCat)&&matches(c.framework,fwCatOf(c.framework)[0]));}
function complianceCards(){
  const all=fwList(), list=(showAllFw||query)?all:all.slice(0,FW_PREVIEW);
  if(!all.length) return `<div class="card no-results" style="grid-column:1/-1">No frameworks match.</div>`;
  return list.map(c=>{
    const s=Math.max(0,Math.min(100,Number(c.score)||0)), cat=fwCatOf(c.framework), [top,num]=badgeParts(c.framework);
    return `<div class="card fw">
      <div class="badge" style="color:${cat[2]};background:${cat[3]};border-color:${cat[4]}"><b${top.length>4?' class="sm"':''}>${esc(top)}</b>${num?`<i>${esc(num)}</i>`:''}</div>
      <div class="fw-body">
        <div class="fw-name">${esc(c.framework)}</div>
        <div class="fw-cat">${esc(cat[0])}</div>
        <div class="bar"><span style="width:${s}%;background:${scoreColor(s)}"></span></div>
        <div class="fw-foot"><span>Verified ${esc(fmtDate(c.last_verified))}</span><span class="fw-score" style="color:${scoreColor(s)}">${Math.round(s*10)/10}%</span></div>
      </div>
    </div>`;}).join('');
}
function moreButton(){
  const n=fwList().length;
  return (!query && n>FW_PREVIEW)?`<button class="btn btn-ghost" id="fw-more">${showAllFw?'Show fewer':`View all ${n} frameworks`}</button>`:'';
}
function docItems(){
  const docs=data.documents.filter(d=>(docFilter==='all'||(docFilter==='public')===(d.visibility==='public'))&&matches(d.title,d.category));
  if(!docs.length) return `<div class="empty-note">${data.documents.length?'No documents match.':'No documents published yet.'}</div>`;
  return docs.map(d=>{
    const pub=d.visibility==='public', url=pub&&safeUrl(d.download_url);
    return `<div class="doc">
      <div class="doc-ic">${svg(I.doc)}</div>
      <div class="doc-b"><div class="tag">${esc(d.category||'Document')}</div><div class="doc-t">${esc(d.title)}</div></div>
      <div class="doc-act" style="display:flex;align-items:center;gap:14px">
        <span class="vis">${pub?svg(I.globe,13)+' Public':svg(I.lock,13)+' Access on request'}</span>
        ${url?`<a class="btn btn-sm" href="${esc(url)}" rel="noopener">Download</a>`
             :pub?'':`<button class="btn btn-sm btn-ghost" data-request="${esc(d.id)}">Request access</button>`}
      </div>
    </div>`;}).join('');
}
function securityCards(){
  const items=data.security_posture.map((sp,i)=>[sp,i]).filter(([sp])=>matches(sp.topic,sp.content));
  if(!items.length) return `<div class="card ${data.security_posture.length?'no-results':'empty-note'}" style="grid-column:1/-1">${data.security_posture.length?'No security topics match.':'No security information published yet.'}</div>`;
  return items.map(([sp,i])=>`
    <button class="card sp" data-topic="${i}"${sp.content?'':' disabled'}>
      <div class="sp-top"><div class="sp-ic">${svg(topicIcon(sp.topic))}</div><div class="sp-t">${esc(sp.topic)}</div></div>
      <div class="sp-x${sp.content?'':' empty'}">${esc(sp.content?sp.content.replace(/^[\s\-•*]+/,''):'Not published yet.')}</div>
      ${sp.content?`<div class="sp-m">Read more ${svg(I.arrow,14)}</div>`:''}
    </button>`).join('');
}
function faqItems(){
  const qs=data.qa_highlights.filter(qa=>matches(qa.question,qa.answer));
  return qs.length?qs.map(qa=>`<details><summary>${esc(qa.question)}</summary><div class="a">${esc(qa.answer)}</div></details>`).join('')
    :'<div class="no-results">No questions match.</div>';
}
function refresh(){
  document.getElementById('fw-grid') && (document.getElementById('fw-grid').innerHTML=complianceCards());
  document.getElementById('fw-more-wrap') && (document.getElementById('fw-more-wrap').innerHTML=moreButton());
  document.getElementById('doc-list') && (document.getElementById('doc-list').innerHTML=docItems());
  document.getElementById('sp-grid').innerHTML=securityCards();
  document.getElementById('faq-list') && (document.getElementById('faq-list').innerHTML=faqItems());
}

function render(){
  const name=(data.company_name||'').trim()||'Trust Center';
  const fws=data.compliance;
  const latest=fws.map(c=>c.last_verified).filter(Boolean).sort().pop();
  const pubDocs=data.documents.filter(d=>d.visibility==='public').length, privDocs=data.documents.length-pubDocs;
  const intro=data.intro_text||`This page shows how ${name} keeps its platform and customer data secure. The compliance scores come from automated checks on ${name}'s live cloud environment, and each one shows when it was last verified.`;
  const initial=esc(name.charAt(0).toUpperCase());
  const cats=CATS.map(c=>[c[0],fws.filter(f=>fwCatOf(f.framework)===c).length]).filter(c=>c[1]);
  const links=[['compliance','Compliance'],...(data.documents.length?[['documents','Documents']]:[]),['security','Security'],...(data.qa_highlights.length?[['faq','FAQ']]:[])];
  document.title=`${name} Trust Center`;
  document.getElementById('v-content').innerHTML=`
    <header class="top"><div class="wrap">
      <a class="brand" href="#"><div class="logo">${initial}</div><div class="brand-name">${esc(name)}</div><div class="brand-tc">Trust Center</div></a>
      <nav class="links">${links.map(([id,l])=>`<a href="#${id}" data-nav="${id}">${l}</a>`).join('')}</nav>
      <div class="top-actions">
        ${data.contact_email?`<a class="btn btn-ghost" href="mailto:${esc(data.contact_email)}">Contact</a>`:''}
        ${privDocs?`<a class="btn" href="#documents">Request access</a>`:`<a class="btn" href="#compliance">View compliance</a>`}
      </div>
    </div></header>

    <section class="hero"><div class="wrap">
      <div>
        <div class="live"><span class="live-dot"></span>Continuously monitored${latest?' · last verified '+esc(fmtDate(latest)):''}</div>
        <div class="hero-logo">${initial}</div>
        <h1>${esc(name)} Trust Center</h1>
        <p>${esc(intro)}</p>
        <div class="hero-cta">
          <a class="btn btn-light" href="#compliance">View compliance ${svg(I.arrow,15)}</a>
          ${data.documents.length?`<a class="btn btn-outline-light" href="#documents">Documents</a>`:''}
          ${data.contact_email?`<a class="btn btn-outline-light" href="mailto:${esc(data.contact_email)}">${svg(I.mail,15)} Ask a question</a>`:''}
        </div>
      </div>
      <div class="summary">
        <div class="sum-row"><div class="sum-ic">${svg(I.check,19)}</div><div><div class="sum-v">${fws.length}</div><div class="sum-l">Frameworks monitored by automated checks</div></div></div>
        <div class="sum-row"><div class="sum-ic">${svg(I.clock,19)}</div><div><div class="sum-v">${esc(latest?fmtDate(latest):'Not yet')}</div><div class="sum-l">Last verified: live data, not a snapshot</div></div></div>
        <div class="sum-row"><div class="sum-ic">${svg(I.doc,19)}</div><div><div class="sum-v">${data.documents.length}</div><div class="sum-l">Documents · ${pubDocs} public, ${privDocs} on request</div></div></div>
      </div>
      <label class="search">${svg(I.search,18)}<input id="q" type="search" placeholder="Search frameworks, documents and security topics" aria-label="Search this Trust Center"></label>
    </div></section>

    <main><div class="wrap">
      <section class="sec" id="compliance">
        <div class="sec-h">
          <div><div class="eyebrow">Compliance</div><h2>Frameworks and standards</h2><div class="sec-sub">Continuously measured, not a one-time certificate. Every score shows when it was last verified.</div></div>
          ${cats.length>1?`<div class="chips">${[['All',fws.length],...cats].map(([c,n])=>`<button class="chip${c===fwCat?' on':''}" data-cat="${esc(c)}">${esc(c)}<span class="n">${n}</span></button>`).join('')}</div>`:''}
        </div>
        ${fws.length?`<div class="fw-grid" id="fw-grid">${complianceCards()}</div><div class="more" id="fw-more-wrap">${moreButton()}</div>`
          :`<div class="card empty-note">No compliance results published yet.</div>`}
      </section>

      ${data.documents.length?`<section class="sec" id="documents">
        <div class="sec-h">
          <div><div class="eyebrow">Resources</div><h2>Documents</h2><div class="sec-sub">Public documents download directly. For other documents, request access and the ${esc(name)} team reviews your request.</div></div>
          ${data.documents.length?`<div class="chips">${['all','public','private'].map(f=>`<button class="chip${f===docFilter?' on':''}" data-filter="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div>`:''}
        </div>
        <div class="card doc-list" id="doc-list">${docItems()}</div>
      </section>`:''}

      <section class="sec" id="security">
        <div class="sec-h"><div><div class="eyebrow">Security</div><h2>How ${esc(name)} protects your data</h2><div class="sec-sub">The security practices ${esc(name)} has published. Open a topic to read it in full.</div></div></div>
        <div class="sp-grid" id="sp-grid">${securityCards()}</div>
      </section>

      ${data.qa_highlights.length?`
      <section class="sec" id="faq">
        <div class="sec-h"><div><div class="eyebrow">Knowledge base</div><h2>Frequently asked questions</h2><div class="sec-sub">Approved answers from ${esc(name)}'s security questionnaire library.</div></div></div>
        <div class="card faq" id="faq-list">${faqItems()}</div>
      </section>`:''}

      <section class="sec" style="margin-bottom:0">
        <div class="cta">
          <div><h2>Need more for your security review?</h2><p>${data.contact_email?`Contact the ${esc(name)} team at ${esc(data.contact_email)}.`:privDocs?'Request access to the private documents above.':'All information on this page is updated automatically after every scan.'}</p></div>
          ${data.contact_email?`<a class="btn btn-light" href="mailto:${esc(data.contact_email)}">Contact us</a>`:privDocs?`<a class="btn btn-light" href="#documents">Request access</a>`:''}
        </div>
      </section>
    </div></main>

    <footer class="foot"><div class="wrap">
      <span>© ${new Date().getFullYear()} ${esc(name)}</span>
      <span>Trust Center powered by <b>Niagaros</b></span>
    </div></footer>
  `;
  document.getElementById('v-load').hidden=true;
  document.getElementById('v-content').hidden=false;
  document.getElementById('q').addEventListener('input',e=>{ query=e.target.value.trim().toLowerCase(); refresh(); });
  watchNav();
}

function watchNav(){
  const links=[...document.querySelectorAll('[data-nav]')];
  if(!('IntersectionObserver' in window) || !links.length) return;
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting) links.forEach(l=>l.classList.toggle('on',l.dataset.nav===e.target.id)); });
  },{rootMargin:'-90px 0px -65% 0px'});
  links.forEach(l=>{ const s=document.getElementById(l.dataset.nav); if(s) obs.observe(s); });
}

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.classList.contains('overlay') || t.closest('[data-close]')){ closeOv(); return; }
  if(t.closest('#fw-more')){ showAllFw=!showAllFw; refresh(); return; }
  const cat=t.closest('[data-cat]');
  if(cat){ fwCat=cat.dataset.cat; showAllFw=false; document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('on',b===cat)); refresh(); return; }
  const tab=t.closest('[data-filter]');
  if(tab){ docFilter=tab.dataset.filter; document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('on',b===tab)); refresh(); return; }
  const req=t.closest('[data-request]');
  if(req){ openRequest(req.dataset.request); return; }
  const topic=t.closest('[data-topic]');
  if(topic && !topic.disabled){ const sp=data.security_posture[+topic.dataset.topic];
    document.getElementById('topic-title').textContent=sp.topic; document.getElementById('topic-text').textContent=sp.content;
    document.getElementById('ov-topic').classList.add('open'); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeOv(); });
document.getElementById('req-send').addEventListener('click',submitRequest);

function openRequest(docId){
  requestingDocId=docId;
  const doc=data.documents.find(d=>String(d.id)===String(docId));
  document.getElementById('req-doc').textContent=doc?'Document: '+doc.title:'';
  ['req-name','req-email','req-reason','req-nda-name'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('req-nda').checked=false;
  document.getElementById('ov-request').classList.add('open');
}
async function submitRequest(){
  const name=document.getElementById('req-name').value.trim();
  const email=document.getElementById('req-email').value.trim();
  const ndaChecked=document.getElementById('req-nda').checked;
  const ndaName=document.getElementById('req-nda-name').value.trim();
  if(!name||!email){showToast('Name and email address are required');return;}
  if(!ndaChecked||!ndaName){showToast('Confirm the confidentiality notice and type your full name');return;}
  try{
    const r=await fetch(TC_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      action:'request_access',document_id:requestingDocId,requester_name:name,requester_email:email,
      reason:document.getElementById('req-reason').value.trim(),
      nda_accepted_name:ndaName,
    })});
    const d=await r.json();
    if(!r.ok){ showToast(d.error||'Request failed'); return; }
  }catch(e){ showToast('Request failed. Please try again.'); return; }
  closeOv();
  showToast('Request sent. You will be notified once it has been reviewed.');
}
load();
</script>
</body>
</html>
