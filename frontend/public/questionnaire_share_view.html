<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Questionnaire</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f5f6f8;color:#111827;font-size:14px;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:40px 24px 80px}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hdr-icon{width:32px;height:32px;background:#111827;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.hdr-brand{font-size:13px;font-weight:700;color:#6b7280}
.title{font-size:22px;font-weight:800;margin:14px 0 4px;text-wrap:balance}
.meta{font-size:12px;color:#9ca3af;margin-bottom:28px}
.progress-bar{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-bottom:6px}
.progress-fill{height:100%;background:#059669;border-radius:3px}
.progress-lbl{font-size:11px;color:#9ca3af;margin-bottom:28px}
.item{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px 20px;margin-bottom:12px}
.item-q{font-size:13px;font-weight:700;color:#111827;margin-bottom:8px}
.item-num{color:#9ca3af;font-weight:700;margin-right:6px}
.item-a{font-size:12.5px;color:#374151;line-height:1.6;white-space:pre-wrap}
.item-pending{font-size:12px;color:#d97706;background:#fffbeb;border:1px solid #fde68a;border-radius:7px;padding:8px 12px;display:inline-block}
.spin-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:12px;color:#9ca3af}
.spinner{width:28px;height:28px;border:3px solid #e5e7eb;border-top-color:#059669;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:24px;text-align:center;color:#991b1b;margin-top:60px}
.error-box .ic{font-size:26px;margin-bottom:10px}
[hidden]{display:none!important}
.print-btn{position:fixed;top:20px;right:20px;background:#111827;color:#fff;border:none;padding:9px 16px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
@media print{.print-btn{display:none}body{background:#fff}.item{border:1px solid #ddd;break-inside:avoid}}
</style>
</head>
<body>

<button class="print-btn" onclick="window.print()" id="print-btn" hidden>🖨 Save as PDF</button>

<div class="wrap">
  <div id="v-load" class="spin-wrap"><div class="spinner"></div><span>Loading…</span></div>
  <div id="v-content" hidden></div>
  <div id="v-error" hidden class="error-box">
    <div class="ic">⚠</div>
    <div id="error-msg"></div>
  </div>
</div>

<script>
const QNR_API = 'https://hzf92ft6j7.execute-api.eu-west-1.amazonaws.com/default/questionnaires';
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function load(){
  const token=new URLSearchParams(location.search).get('token');
  if(!token){ showError('No share link token provided.'); return; }
  try{
    const r=await fetch(QNR_API+'?share_token='+encodeURIComponent(token));
    const d=await r.json();
    if(!r.ok){ showError(d.error||'This link is invalid or has expired.'); return; }
    render(d);
  }catch(e){
    showError('Could not load this questionnaire — check your connection and try again.');
  }
}

function showError(msg){
  document.getElementById('v-load').hidden=true;
  document.getElementById('v-error').hidden=false;
  document.getElementById('error-msg').textContent=msg;
}

function render(d){
  const answered=d.items.filter(i=>i.status==='answered').length;
  const pct=d.items.length?Math.round(answered/d.items.length*100):0;
  document.getElementById('v-content').innerHTML=`
    <div class="hdr"><div class="hdr-icon">🛡</div><div class="hdr-brand">Niagaros — Security Review Response</div></div>
    <div class="title">${esc(d.name)}</div>
    <div class="meta">Shared on ${new Date().toLocaleDateString()} · originally compiled ${new Date(d.created_at).toLocaleDateString()}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-lbl">${answered} of ${d.items.length} questions answered and internally approved</div>
    ${d.items.map(i=>`<div class="item">
      <div class="item-q"><span class="item-num">Q${i.row_number}</span>${esc(i.question_text)}</div>
      ${i.status==='answered' ? `<div class="item-a">${esc(i.answer_text)}</div>` : `<div class="item-pending">Pending internal review — not yet available</div>`}
    </div>`).join('')}
  `;
  document.getElementById('v-load').hidden=true;
  document.getElementById('v-content').hidden=false;
  document.getElementById('print-btn').hidden=false;
}

load();
</script>
</body>
</html>
