<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Niagaros — Auditor Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f0f2f5;color:#111827;font-size:14px}
header{background:#0d0f14;color:#fff;padding:14px 28px;display:flex;align-items:center;gap:10px;font-weight:700}
header span{font-weight:500;color:#9ca3af;font-size:12.5px;margin-left:auto}
main{max-width:920px;margin:24px auto;padding:0 20px 60px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px 22px;margin-bottom:18px}
h1{font-size:19px;font-weight:800}
h2{font-size:14px;font-weight:700;margin:22px 0 10px}
.meta{font-size:12px;color:#6b7280;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.notice{background:#eff6ff;border:1px solid #dbeafe;color:#1e40af;border-radius:10px;padding:10px 14px;font-size:12px;margin-bottom:18px}
.finding{border:1px solid #f0f0f0;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.sev{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;background:#f3f4f6}
.sev.CRITICAL,.sev.HIGH{background:#fef2f2;color:#b91c1c}.sev.MEDIUM{background:#fffbeb;color:#b45309}.sev.LOW{background:#f0fdf4;color:#15803d}
.st{font-size:11px;color:#6b7280;margin-left:8px}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f6f6f6;font-size:12.5px}
.row span{flex:1}
input,select,textarea{width:100%;border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;font:inherit;font-size:12.5px;margin-top:6px}
button{background:#1d4ed8;color:#fff;border:0;border-radius:7px;padding:8px 14px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;margin-top:8px}
button.ghost{background:#fff;color:#374151;border:1px solid #e5e7eb;margin-top:0;padding:5px 10px;font-size:11.5px}
.comment{font-size:12px;background:#f9fafb;border-radius:8px;padding:7px 10px;margin-top:6px}
.err{color:#b91c1c;font-size:13px;padding:40px 0;text-align:center}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:8px;font-size:12.5px;display:none}
</style>
</head>
<body>
<header>🛡 Niagaros <span id="who"></span></header>
<main id="root"><div class="card">Loading your audit workspace…</div></main>
<div class="toast" id="toast"></div>
<script>
const API = 'https://hzf92ft6j7.execute-api.eu-west-1.amazonaws.com/default/audit-management';
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
async function call(method, params, body){
  const q = '?auditor_token=' + encodeURIComponent(TOKEN) + (params ? '&' + params : '');
  const r = await fetch(API + (method === 'GET' ? q : ''), {method, headers: {'Content-Type':'application/json'}, body: method === 'POST' ? JSON.stringify({auditor_token: TOKEN, ...body}) : undefined});
  return {ok: r.ok, status: r.status, data: await r.json().catch(() => ({}))};
}
async function load(){
  if(!TOKEN){ document.getElementById('root').innerHTML='<div class="err">This page needs the private link from your invitation email.</div>'; return; }
  const r = await call('GET');
  if(!r.ok){ document.getElementById('root').innerHTML='<div class="err">'+esc(r.data.error || 'This link is not valid.')+'</div>'; return; }
  const a = r.data.audit;
  document.getElementById('who').textContent = 'Signed in as ' + (r.data.auditor.name || r.data.auditor.email);
  const findings = (a.findings || []).map(f => `
    <div class="finding">
      <span class="sev ${esc(f.severity)}">${esc(f.severity)}</span> <strong>${esc(f.title)}</strong><span class="st">${esc(String(f.status).replace('_',' '))}</span>
      ${f.description ? `<div style="margin-top:6px;font-size:12.5px;color:#374151">${esc(f.description)}</div>` : ''}
      ${(f.remediation_tasks || []).map(t => `<div class="row"><span>🛠 ${esc(t.title)}${t.due_date ? ' (due ' + esc(t.due_date) + ')' : ''}</span><span style="flex:0;white-space:nowrap;color:#6b7280">${esc(String(t.status).replace('_',' '))}</span></div>`).join('')}
      ${(f.comments || []).map(c => `<div class="comment"><strong>${esc(c.author || '')}</strong> — ${esc(c.body)}</div>`).join('')}
      <input id="c-${esc(f.id)}" placeholder="Add a comment for the audited team…"><button class="ghost" style="margin-top:6px" data-comment="${esc(f.id)}">Comment</button>
    </div>`).join('') || '<div style="color:#6b7280;font-size:12.5px">No findings yet.</div>';
  const evidence = (a.evidence || []).map(e => `<div class="row"><span>📎 ${esc(e.title)}</span>${e.has_file ? `<button class="ghost" data-evidence="${esc(e.id)}">Download</button>` : ''}</div>`).join('') || '<div style="color:#6b7280;font-size:12.5px">No evidence has been submitted yet.</div>';
  document.getElementById('root').innerHTML = `
    <div class="notice">🔒 This is your private, read-and-comment workspace for this audit only. You can view the audit, download its evidence, and record findings and comments. Nothing else in the organization is visible to you.</div>
    <div class="card"><h1>${esc(a.title)}</h1>
      <div class="meta"><span>${esc(a.framework_label || 'No framework')}</span><span>${esc(String(a.audit_type).replace('_',' '))}</span><span>Status: ${esc(String(a.status).replace('_',' '))}</span><span>${esc(a.start_date || '—')} → ${esc(a.end_date || '—')}</span></div>
      ${a.scope_description ? `<p style="margin-top:12px;font-size:12.5px;color:#374151"><strong>Scope:</strong> ${esc(a.scope_description)}</p>` : ''}
      <div class="meta"><span>Findings: ${esc(a.findings_total)} (${esc(a.findings_open)} open)</span><span>Audit readiness: ${esc(a.audit_readiness_score)}%</span><span>Evidence completeness: ${esc(a.evidence_completeness_pct)}%</span></div></div>
    <div class="card"><h2 style="margin-top:0">Evidence</h2>${evidence}</div>
    <div class="card"><h2 style="margin-top:0">Findings (${(a.findings || []).length})</h2>${findings}
      <h2>Record a new finding</h2>
      <input id="nf-title" placeholder="Finding title"><select id="nf-sev"><option value="MEDIUM">Medium</option><option value="HIGH">High</option><option value="CRITICAL">Critical</option><option value="LOW">Low</option></select>
      <textarea id="nf-desc" rows="3" placeholder="What did you observe?"></textarea><button id="nf-add">Add finding</button></div>`;
  document.getElementById('nf-add').onclick = addFinding;
  document.querySelectorAll('[data-comment]').forEach(b => b.onclick = () => addComment(b.dataset.comment));
  document.querySelectorAll('[data-evidence]').forEach(b => b.onclick = () => download(b.dataset.evidence));
}
async function addFinding(){
  const title = document.getElementById('nf-title').value.trim();
  if(!title){ toast('Enter a title first'); return; }
  const r = await call('POST', null, {action:'auditor_add_finding', title, severity: document.getElementById('nf-sev').value, description: document.getElementById('nf-desc').value.trim()});
  toast(r.ok ? 'Finding recorded' : (r.data.error || 'Could not record the finding')); if(r.ok) load();
}
async function addComment(id){
  const body = document.getElementById('c-' + id).value.trim();
  if(!body){ toast('Write a comment first'); return; }
  const r = await call('POST', null, {action:'auditor_add_comment', finding_id:id, body});
  toast(r.ok ? 'Comment added' : (r.data.error || 'Could not add the comment')); if(r.ok) load();
}
async function download(id){
  const r = await call('GET', 'download_evidence=' + encodeURIComponent(id));
  if(r.ok && r.data.download_url) window.open(r.data.download_url, '_blank', 'noopener'); else toast(r.data.error || 'Download failed');
}
load();
</script>
</body>
</html>
